<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>akko</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #07070a;
            }

            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                background: #07070a;
                transition: opacity 0.3s ease;
            }

            #splash.is-hidden {
                opacity: 0;
                pointer-events: none;
            }

            #splash svg {
                width: 76px;
                height: 76px;
            }
        </style>
    </head>

    <body>
        <div id="splash"><!-- app-icon --></div>
        <div id="app"></div>
        <script type="module" src="/renderer.ts"></script>
    </body>
</html>
