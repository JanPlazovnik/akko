name: Build

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    make:
        strategy:
            fail-fast: false
            matrix:
                # windows-latest ships Visual Studio 2026, which forge 7's node-gyp can't find yet;
                # better-sqlite3 compiles on install, so stay on 2022 until forge 8
                os: [windows-2022, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg squashfs-tools

            - run: npm ci

            - if: runner.os == 'Linux'
              run: npm run make

            # Velopack builds the Windows installer and updates from the packaged app. Its CLI has
            # to match the velopack npm package's version.
            - if: runner.os == 'Windows'
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - if: runner.os == 'Windows'
              shell: bash
              run: |
                  version="$(node -p "require('./package.json').version")"
                  npm run package
                  dotnet tool install -g vpk --version "$(node -p "require('velopack/package.json').version")"
                  # The previous release lets vpk build a delta update; the first Velopack release has none
                  vpk download github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --outputDir releases || true
                  vpk pack --packId akko --packVersion "$version" \
                      --packDir out/akko-win32-x64 --mainExe akko.exe --packTitle akko --runtime win-x64 \
                      --packAuthors relevantcroissant --icon assets/icon.ico \
                      --splashImage assets/installing.gif --outputDir releases
                  # The previous release's package was only needed for the delta
                  find releases -name '*.nupkg' ! -name "*-$version-*" -delete
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/upload-artifact@v4
              with:
                  name: akko-${{ runner.os }}
                  # RELEASES and the full .nupkg also let Squirrel installs update into Velopack
                  path: |
                      releases/*-Setup.exe
                      releases/*.nupkg
                      releases/RELEASES
                      releases/releases.win.json
                      releases/assets.win.json
                      out/make/**/*.deb
                      out/make/**/*.rpm
                      out/make/**/*.AppImage
                  if-no-files-found: error
                  retention-days: 1

    release:
        needs: make
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            # The notes are the annotated tag's message; checkout drops it, so fetch the tag itself
            - name: Read release notes from the tag
              run: |
                  git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
                  if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
                      git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
                  fi
                  touch notes.md

            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*
                  body_path: notes.md
                  generate_release_notes: true
