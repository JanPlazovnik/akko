name: Build

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    make:
        strategy:
            fail-fast: false
            matrix:
                # windows-latest ships Visual Studio 2026, which forge 7's node-gyp can't find yet;
                # better-sqlite3 compiles on install, so stay on 2022 until forge 8
                os: [windows-2022, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg squashfs-tools

            - run: npm ci

            - run: npm run make

            - uses: actions/upload-artifact@v4
              with:
                  name: akko-${{ runner.os }}
                  path: |
                      out/make/**/*.exe
                      out/make/**/*.nupkg
                      out/make/**/RELEASES
                      out/make/**/*.deb
                      out/make/**/*.rpm
                      out/make/**/*.AppImage
                  if-no-files-found: error
                  retention-days: 1

    release:
        needs: make
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            # The notes are the annotated tag's message; checkout drops it, so fetch the tag itself
            - name: Read release notes from the tag
              run: |
                  git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
                  if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
                      git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
                  fi
                  touch notes.md

            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*
                  body_path: notes.md
                  generate_release_notes: true
