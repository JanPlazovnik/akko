name: Build

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    make:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg squashfs-tools

            - run: npm ci

            - run: npm run make

            - uses: actions/upload-artifact@v4
              with:
                  name: akko-${{ runner.os }}
                  path: |
                      out/make/**/*.exe
                      out/make/**/*.nupkg
                      out/make/**/RELEASES
                      out/make/**/*.deb
                      out/make/**/*.rpm
                      out/make/**/*.AppImage
                  if-no-files-found: error
                  retention-days: 1

    release:
        needs: make
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*
                  generate_release_notes: true
